<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sofa WebAR</title>

  <!-- Stable A-Frame and AR.js Build Libraries -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      z-index: 999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    }

    #status {
      font-weight: bold;
      color: #00ffcc;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div id="panel">
    <div><strong>TEC611 WebAR Sofa Viewer</strong></div>
    <div id="status">Point camera at the Hiro marker...</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; antialias: true; logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- Preload 3D Asset -->
    <a-assets timeout="10000">
      <a-asset-item id="sofaModel" src="./assets/sofa_final.glb"></a-asset-item>
    </a-assets>

    <!-- Ambient & Directional Lights (Prevents Black Model) -->
    <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
    <a-entity light="type: directional; intensity: 1.0;" position="1 4 2"></a-entity>

    <!-- Hiro Marker Anchor -->
    <a-marker preset="hiro" id="hiroMarker">
      <!-- Test Red Cube (Verifies Marker Detection) -->
      <a-box position="0 0.25 0" scale="0.2 0.2 0.2" color="red"></a-box>

      <!-- 3D Sofa GLB Entity -->
      <a-entity
        id="sofaEntity"
        gltf-model="#sofaModel"
        position="0 0 0"
        scale="0.05 0.05 0.05"
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusDiv = document.getElementById('status');
    const marker = document.getElementById('hiroMarker');

    // Detect when marker is found or lost
    marker.addEventListener('markerFound', () => {
      statusDiv.textContent = "MARKER FOUND! Rendering sofa...";
      statusDiv.style.color = "#00ff00";
    });

    marker.addEventListener('markerLost', () => {
      statusDiv.textContent = "Marker lost. Point camera back at Hiro marker.";
      statusDiv.style.color = "#ffcc00";
    });

    // Force 0.5x Ultra-Wide Lens Constraint for broken main cameras
    window.addEventListener('camera-init', () => {
      setTimeout(() => {
        const video = document.querySelector('video');
        if (video && video.srcObject) {
          const track = video.srcObject.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            const capabilities = track.getCapabilities();
            if (capabilities.zoom) {
              track.applyConstraints({
                advanced: [{ zoom: capabilities.zoom.min }]
              }).catch(err => console.warn('Ultra-wide constraint ignored:', err));
            }
          }
        }
      }, 1000);
    });
  </script>
</body>
</html>
